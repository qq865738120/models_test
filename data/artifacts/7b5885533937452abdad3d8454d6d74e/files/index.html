<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑车送布丁</title>
<style>
  :root {
    --ink:#23343f; --muted:#5c707d; --card:#fffdf8; --line:#eadfc9;
    --coral:#e2573f; --amber:#e9a01f; --teal:#2a9d8f; --sky:#4aa3c7;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, #fff8e7 0 18%, transparent 18.5%),
      radial-gradient(circle at 88% 14%, #e9f9ff 0 16%, transparent 16.5%),
      linear-gradient(160deg,#fdf4e3 0%,#f2fbff 46%,#e6f7fb 100%);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(12px,3vw,36px);
  }
  .card {
    width:100%; max-width:1020px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:26px;
    box-shadow:0 22px 60px rgba(61,84,95,.18), 0 3px 0 rgba(255,255,255,.8) inset;
    padding:clamp(16px,3.2vw,32px);
  }
  header { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; margin:0 4px 18px; }
  .eyebrow { display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.18em; color:var(--coral); font-weight:700; text-transform:uppercase; }
  .eyebrow::before { content:""; width:22px; height:3px; border-radius:2px; background:var(--coral); }
  h1 { margin:6px 0 2px; font-size:clamp(24px,3.4vw,38px); letter-spacing:.03em; line-height:1.15; }
  .sub { margin:0; color:var(--muted); font-size:clamp(12px,1.5vw,14px); }
  .badge {
    display:inline-flex; align-items:center; gap:7px;
    background:#effaf5; color:#1d7c64; border:1px solid #bfe8d8;
    padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .badge i { width:8px; height:8px; border-radius:50%; background:#2a9d8f; box-shadow:0 0 0 4px rgba(42,157,143,.14); }
  .stage {
    position:relative; border-radius:20px; overflow:hidden;
    border:1px solid #cfe3ea; background:#bceaff;
    box-shadow:0 10px 24px rgba(64,107,124,.16) inset;
    line-height:0;
  }
  .stage svg { display:block; width:100%; height:auto; }
  .timeline { list-style:none; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0; margin:16px 2px 0; }
  .timeline li {
    display:flex; align-items:center; gap:9px;
    background:#fbf8f1; border:1px solid #ece3d2; border-radius:14px;
    padding:9px 11px; font-size:clamp(11px,1.3vw,13px); color:#445a66; font-weight:600;
  }
  .timeline b { font-variant-numeric:tabular-nums; color:var(--ink); font-weight:800; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.a { background:var(--sky); } .dot.b { background:var(--amber); }
  .dot.c { background:var(--coral); } .dot.d { background:var(--teal); }
  .note { margin:10px 4px 0; font-size:11.5px; color:#8798a2; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  @media (max-width:640px) {
    .timeline { grid-template-columns:repeat(2,1fr); }
    header { align-items:flex-start; }
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <div>
      <div class="eyebrow">Pelican Delivery · 6s Loop</div>
      <h1>鹈鹕骑车送布丁</h1>
      <p class="sub">一只白鹈鹕、一辆两轮车、一份布丁——赶在颠簸把甜点颠飞之前。</p>
    </div>
    <span class="badge"><i></i>纯 SVG / SMIL · 无脚本</span>
  </header>

  <div class="stage">
<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">

    <stop offset="1" stop-color="#f2fdff"/>

    <stop offset="0" stop-color="#a3e394"/><stop offset="1" stop-color="#7fd07c"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop offset="0" stop-color="#fff6c4" stop-opacity=".95"/>
    <stop offset="1" stop-color="#fff6c4" stop-opacity="0"/>

  <linearGradient id="flanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#ffc64f"/><stop offset="1" stop-color="#f0a62d"/>
  </linearGradient>
  <linearGradient id="caramelGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d68a2d"/><stop offset="1" stop-color="#a75c17"/>
  </linearGradient>
  <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7edf1"/>
  </linearGradient>
  <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe6a8"/><stop offset=".6" stop-color="#ffd078"/><stop offset="1" stop-color="#f3b34f"/>
  </linearGradient>
  <pattern id="bumpStripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
    <rect width="16" height="16" fill="#ffd23f"/>
    <rect width="8" height="16" fill="#333941"/>
  </pattern>
  <g id="groundTile">
    <!-- dashed lane markings (period 90 => 6 per 540 tile) -->
    <g fill="#ffd766">

      <ellipse cx="148" cy="468" rx="5" ry="1.7"/>
      <ellipse cx="205" cy="440" rx="3" ry="1.4"/>

  </g>
