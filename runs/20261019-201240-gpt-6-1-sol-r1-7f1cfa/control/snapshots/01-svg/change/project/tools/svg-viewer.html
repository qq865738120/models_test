<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG时间采样</title><style>body{font:16px/1.6 system-ui;margin:24px;background:#eef3f8;color:#21344e}object{display:block;width:640px;height:480px;max-width:100%;background:white;margin:20px 0}button{margin:4px;padding:8px 12px}#status{min-height:24px}</style></head><body>
<h1>SVG时间采样</h1><p>只加载本项目 solution/animation.svg。工具中的脚本不属于参赛SVG。选择采样时刻后，由浏览器工具保存真实截图；不会自动判断空间关系。</p>
<div id="buttons"></div><button id="play">从头播放</button><p id="status" aria-live="polite">等待SVG加载</p>
<object id="scene" type="image/svg+xml" data="../solution/animation.svg"></object>
<script>
const object=document.getElementById('scene'),status=document.getElementById('status');
function get(){const doc=object.contentDocument;if(!doc||doc.documentElement.tagName.toLowerCase()!=='svg')throw Error('尚无可用SVG，请先完成 solution/animation.svg');return doc}
for(const second of [0,2,2.5,3.5,4,5.9,6,6.01,12,18]){
 const button=document.createElement('button');button.textContent=second+'秒';document.getElementById('buttons').append(button);
 button.onclick=()=>{try{const doc=get(),svg=doc.documentElement;svg.pauseAnimations();svg.setCurrentTime(second);for(const animation of doc.getAnimations()){animation.pause();animation.currentTime=second*1000}status.textContent='采样时刻：'+second+'秒（SMIL和CSS）'}catch(e){status.textContent=e.message}};
}
document.getElementById('play').onclick=()=>{try{const doc=get(),svg=doc.documentElement;svg.setCurrentTime(0);svg.unpauseAnimations();for(const animation of doc.getAnimations()){animation.currentTime=0;animation.play()}status.textContent='从0秒连续播放；检查三个周期'}catch(e){status.textContent=e.message}};
object.onload=()=>{try{get();status.textContent='SVG已加载，可播放或采样'}catch(e){status.textContent=e.message}};
</script></body></html>
